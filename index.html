<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achilleas Apostolou</title>
  <meta name="description" content="A personal website/portfolio.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Achilleas Apostolou">
  <meta property="og:description" content="A personal website/portfolio.">
  <meta property="og:image" content="https://achilleasapostolou.gr/assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="assets/img/avatar.webp" as="image">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="glow" aria-hidden="true"></div>

  <header class="bar" id="top">
    <div class="profile" id="profile"></div>
    <nav class="nav" aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#cv">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="socials" id="socials-top"></div>
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
    <div class="menu" id="menu" aria-label="Menu"></div>
  </header>

  <main>
    <section class="hero" id="hero">
      <p class="eyebrow reveal">Portfolio</p>
      <h1 class="reveal" id="headline"></h1>
      <p class="intro reveal" id="intro"></p>
    </section>

    <section class="work" id="work" aria-label="Selected work">
      <div class="work-grid" id="work-grid"></div>
    </section>

    <section class="about" id="about">
      <figure class="portrait reveal"><img id="portrait" alt="Portrait of Achilleas Apostolou" decoding="async"></figure>
      <div class="about-text reveal">
        <p class="eyebrow">About</p>
        <h2 id="about-title"></h2>
        <p id="about-text"></p>
        <ul class="facts" id="facts"></ul>
        <a class="btn" id="cv-btn" target="_blank" rel="noopener"></a>
      </div>
    </section>

    <section class="cv" id="cv">
      <div class="cv-col reveal"><h3>Experience</h3><ol class="timeline" id="experience"></ol></div>
      <div class="cv-col reveal"><h3>Education</h3><ol class="timeline" id="education"></ol></div>
      <div class="cv-extra reveal"><h3>Activities</h3><ul class="acts" id="activities"></ul></div>
    </section>

    <section class="quote reveal" aria-label="Quote">
      <blockquote><p id="quote-text"></p><footer id="quote-by"></footer></blockquote>
    </section>

    <section class="contact" id="contact">
      <div class="contact-main">
        <p class="eyebrow reveal">Contact</p>
        <h2 class="reveal" id="contact-title"></h2>
        <p class="reveal" id="contact-text"></p>
      </div>
      <div class="contact-side">
        <div class="contact-row reveal">
          <a class="mail" id="contact-mail"></a>
          <button class="btn ghost" id="copy-mail" type="button">Copy</button>
        </div>
        <div class="socials big reveal" id="socials-contact"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span id="foot-name"></span>
    <span id="foot-updated"></span>
  </footer>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-scroll" id="modal-scroll">
      <a class="close" id="modal-close" href="#" aria-label="Close project">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <dialog id="lightbox" aria-label="Image preview"><img alt=""></dialog>
  <a class="to-top" id="to-top" href="#top" aria-label="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg></a>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;font-family:sans-serif">Achilleas Apostolou — 3D TD &amp; Media Technologist. Enable JavaScript to view this site, or write to achillesapostolou@pm.me.</p>
  </noscript>

  <script src="js/app.js" defer></script>
</body>
</html>
